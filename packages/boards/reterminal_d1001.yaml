# Seeed reTerminal D1001 — ESP32-P4 (+ ESP32-C6 WiFi/BLE via SDIO).
# Écran MIPI-DSI 800x1280 portrait (modèle intégré SEEED-RETERMINAL-D1001).
# Brochage extrait du SCHÉMA OFFICIEL Seeed (reTerminal D1001_sch.pdf, rev v01).
#
# ⚠️ TACTILE : le contrôleur est un GSL3670 (SiLead) — NON SUPPORTÉ par ESPHome
#    (aucune plateforme touchscreen gsl/silead). L'écran + le WiFi fonctionnent, mais
#    la navigation tactile nécessitera un composant externe GSL3670 (TODO).
#    Voir docs/lessons-learned.md.
# Enable the Montserrat font sizes AND the widgets/layouts used by the LVGL renderer: the UI
# is built in C++, so the lvgl component can't detect them from YAML and would compile them
# out of lv_conf.h (`lvgl: widgets: []` below). Build flags are read by its lv_conf.h generator.
# Keep the LV_USE_* list in sync with the lv_*_create / lv_obj_set_flex_* calls in
# components/ha_dashboard.
esphome:
  build_flags:
    - "-DLV_FONT_MONTSERRAT_16=1"
    - "-DLV_FONT_MONTSERRAT_20=1"
    - "-DLV_FONT_MONTSERRAT_28=1"
    - "-DLV_FONT_MONTSERRAT_40=1"
    - "-DLV_FONT_MONTSERRAT_48=1"
    - "-DLV_USE_OBJ=1"
    - "-DLV_USE_LABEL=1"
    - "-DLV_USE_BUTTON=1"
    - "-DLV_USE_IMAGE=1"
    - "-DLV_USE_ARC=1"
    - "-DLV_USE_BAR=1"
    - "-DLV_USE_SLIDER=1"
    - "-DLV_USE_FLEX=1"
  on_boot:
    # Latch the main power rail (EXP P8 = BSP_PWR_HOLD, "turn on vdd_3v3" in the Seeed BSP).
    # On USB the board is powered regardless; on battery alone the rail only stays up while
    # this is held high, otherwise the device shuts off as soon as USB is unplugged. Run as
    # early as the expander allows.
    - priority: 600
      then:
        - output.turn_on: d1001_pwr_hold
    # Enable the speaker power amplifier. The Seeed BSP drives it via the XL9535 expander
    # (output port 1, bit 3 = pin P13), NOT the GPIO53 the header's GPIO_OUTPUT_PA define
    # suggests. Without this the ES8311 codec runs but no sound reaches the speaker.
    - priority: -100
      then:
        - output.turn_on: d1001_audio_pa
        # Battery: enable the read path (EXP P6, else the GPIO18 ADC reads nothing) and enable
        # charging (EXP P12 is active-low: low = charge enabled), per the Seeed BSP.
        - output.turn_on: d1001_bat_read_en
        - output.turn_off: d1001_bat_charge_en
        # First battery reading right away instead of after the 60 s interval: until then the
        # level is unknown and the charge limiter hasn't run (the charger stays enabled, so the
        # device reads "charging" above 80 %).
        - delay: 2s
        - component.update: d1001_bat_adc
        - component.update: d1001_battery

esp32:
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  # reTerminal D1001 has 32 MB onboard QSPI flash (+ 32 MB PSRAM), per Seeed specs. Declaring
  # the real size gives a large app partition (the default 4 MB assumption caps the app at
  # ~1.84 MB, which the firmware exceeds once the Music Library launcher / http_request + TLS
  # is included). 32 MB OTA requires enabling IDF experimental features (below).
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      # Execute code/rodata from PSRAM so tasks keep running when the flash cache is disabled
      # (flash write/erase). Needed on the P4 once the audio stack does flash ops, otherwise
      # boot asserts esp_task_stack_is_sane_cache_disabled. Maps to CONFIG_SPIRAM_XIP_FROM_PSRAM.
      execute_from_psram: true
    # Let plain malloc/new spill into PSRAM. ESPHome's psram component selects
    # SPIRAM_USE_CAPS_ALLOC, where malloc/new/std::string only ever use the ~350 KB of internal
    # RAM: under launcher use (cover decodes, HTTP bodies, audio) it fragments until a ~20 KB
    # block is missing and a `new` aborts the device (online_image's JpegDecoder, decoded from
    # on-device crashes). Allocations > 4 KB now go to the 32 MB PSRAM; smaller ones stay
    # internal, and 64 KB of internal RAM stay reserved for DMA/driver buffers.
    sdkconfig_options:
      CONFIG_SPIRAM_USE_CAPS_ALLOC: n
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "65536"

# PSRAM à pleine vitesse (200 MHz) : indispensable pour alimenter le scanout MIPI-DSI
# 800x1280 sans underrun (sinon écran noir / corrompu). Vitesses P4 : 20/100/200 MHz.
psram:
  speed: 200MHZ

# LDO interne alimentant le PHY MIPI-DSI du P4 (canal 3, 2.5V).
esp_ldo:
  - id: ldo_mipi_phy
    channel: 3
    voltage: 2.5V

# WiFi/BLE via le co-processeur ESP32-C6 sur SDIO (le P4 n'a pas de PHY radio).
# Pins schéma : CMD=GPIO6, CLK=GPIO11, D0..D3=GPIO7/8/9/10, C6_CHIP_PU(reset)=GPIO13.
# Le bloc `wifi:` (credentials) reste dans la config device.
esp32_hosted:
  type: sdio
  variant: ESP32C6
  reset_pin: GPIO13
  cmd_pin: GPIO6
  clk_pin: GPIO11
  d0_pin: GPIO7
  d1_pin: GPIO8
  d2_pin: GPIO9
  d3_pin: GPIO10
  active_high: true
  sdio_frequency: 20MHz

# I2C "système" (I2C1 du schéma) : IO expander, RTC, IMU, codec, ADC, chargeur.
i2c:
  - id: i2c_sys
    sda: GPIO20
    scl: GPIO21
    frequency: 400kHz
    scan: false
  # I2C "écran/caméra" (I2C0 du schéma) : touch GSL3670 (0x40) + caméra.
  - id: i2c_panel
    # GPIO37/38 are strapping pins, but hard-wired to the panel I2C on this board.
    sda: { number: GPIO37, ignore_strapping_warning: true }
    scl: { number: GPIO38, ignore_strapping_warning: true }
    frequency: 400kHz
    scan: false

# IO expander XL9535 @ 0x20 (sur I2C système) : pilote enable/reset de l'écran
# (et reset tactile EXP_GPO12). Référencé par le modèle d'écran ci-dessous.
xl9535:
  - id: d1001_expander
    i2c_id: i2c_sys
    address: 0x20

# LCD backlight boost driver (EN/PWM = net LCD_PWM = GPIO14). Without driving it the
# panel power/scanout can be on yet the screen stays black. ALWAYS_ON at full brightness.
output:
  - platform: ledc
    id: d1001_bl_pwm
    pin: GPIO14
    frequency: 2000Hz
  # Speaker power-amplifier enable. The Seeed BSP toggles it on the XL9535 expander
  # (output port 1, bit 3). In ESPHome's octal xl9535 numbering that is pin 13. Held high.
  - platform: gpio
    id: d1001_audio_pa
    pin:
      xl9535: d1001_expander
      number: 13
  # Power hold latch (EXP P8 = port 1, bit 0 -> ESPHome pin 10). Held high while running.
  - platform: gpio
    id: d1001_pwr_hold
    pin:
      xl9535: d1001_expander
      number: 10
  # Battery read enable (EXP P6) — held high so the GPIO18 ADC can read the battery voltage.
  - platform: gpio
    id: d1001_bat_read_en
    pin:
      xl9535: d1001_expander
      number: 6
  # Battery charge enable (EXP P12, active-low) — driven low at boot to allow charging.
  - platform: gpio
    id: d1001_bat_charge_en
    pin:
      xl9535: d1001_expander
      number: 12

# Battery gauge: no I2C fuel gauge — the voltage is read on GPIO18 (ADC1_CH2, 12 dB, on-board
# 2:1 divider) and mapped to a percentage with Seeed's discharge curve. Charge status is a plain
# GPIO (GPIO15, active-low). Pins/curve from the reTerminal-D1001 BSP.
sensor:
  - platform: adc
    id: d1001_bat_adc
    pin: GPIO18
    attenuation: 12db
    update_interval: 60s
    samples: 8
    internal: true
    filters:
      - multiply: 2.0   # on-board 2:1 divider -> actual battery volts
  - platform: template
    name: "Batterie"
    id: d1001_battery
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    # Charge limiter (hysteresis): cut the charger at >= 80 %, re-enable at <= 60 %, hold in
    # between. Applied by d1001_charge_apply, only while the "Limiter la charge" switch is on.
    on_value:
      then:
        - lambda: |-
            if (x >= 80.0f) id(d1001_charge_cut) = true;
            else if (x <= 60.0f) id(d1001_charge_cut) = false;
        - script.execute: d1001_charge_apply
        # Low-battery cutoff: <= 20 % and not charging for 3 consecutive readings (~3 min, to
        # ignore load sag) -> screen off, then drop the power latch. On USB the board stays
        # powered anyway; replugging USB reboots it.
        - lambda: |-
            if (id(d1001_low_cutoff).state && x <= 20.0f && !id(d1001_charging).state) id(d1001_low_count)++;
            else id(d1001_low_count) = 0;
        - if:
            condition:
              lambda: "return id(d1001_low_count) >= 3;"
            then:
              - logger.log: "Battery at or below 20 pct and not charging: powering off"
              - light.turn_off: d1001_backlight
              - delay: 1s
              - output.turn_off: d1001_pwr_hold
    lambda: |-
      static const float t[21] = {3.262f, 3.390f, 3.467f, 3.554f, 3.619f, 3.659f, 3.686f, 3.710f,
                                  3.731f, 3.752f, 3.774f, 3.797f, 3.827f, 3.855f, 3.880f, 3.901f,
                                  3.915f, 3.934f, 3.958f, 3.978f, 4.047f};
      float v = id(d1001_bat_adc).state;
      if (std::isnan(v))
        return {};
      if (v <= t[0])
        return 0.0f;
      if (v >= t[20])
        return 100.0f;
      for (int i = 1; i < 21; i++)
        if (v < t[i])
          return (i - 1) * 5.0f + 5.0f * (v - t[i - 1]) / (t[i] - t[i - 1]);
      return 100.0f;

# Battery longevity: the tablet mostly sits on USB, so hold the charge around 80 %. The switch is
# the only knob exposed to HA; thresholds (80 cut / 60 resume) are fixed in the battery sensor.
# NB: the % is derived from voltage, which the charger pulls up while charging -> it reads a
# bit high, so the real charge level at cut-off is somewhat lower.
globals:
  - id: d1001_charge_cut
    type: bool
    restore_value: no
    initial_value: "false"

  # Backlight on (screen in use). Set by the backlight light below.
  - id: d1001_screen_on
    type: bool
    restore_value: no
    initial_value: "true"

  - id: d1001_low_count
    type: int
    restore_value: no
    initial_value: "0"

switch:
  - platform: template
    name: "Coupure à 20 %"
    id: d1001_low_cutoff
    icon: mdi:battery-alert
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    name: "Limiter la charge à 80 %"
    id: d1001_charge_limit
    icon: mdi:battery-heart-variant
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    turn_on_action:
      - script.execute: d1001_charge_apply
    turn_off_action:
      - script.execute: d1001_charge_apply
  # Charging while the screen is lit makes the display show blue frames: at ~1 A of charge
  # plus the system load, the BQ25616 runs at its input current limit and the system rail
  # sags on every redraw. Charge only while the backlight is off (deep standby); on USB the
  # power path runs the device from the input meanwhile, so the battery just idles.
  - platform: template
    name: "Charger écran éteint seulement"
    id: d1001_charge_screen_off
    icon: mdi:battery-clock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    turn_on_action:
      - script.execute: d1001_charge_apply
    turn_off_action:
      - script.execute: d1001_charge_apply

# Charger enable, from the limiter, the screen state and a low-battery override (<= 25 %:
# charge whatever the screen does, so a plugged tablet never runs flat, and so the 20 %
# cutoff never sees "not charging" on USB).
script:
  - id: d1001_charge_apply
    mode: restart
    then:
      - delay: 10ms   # let an optimistic switch publish its new state first
      - lambda: |-
          float pct = id(d1001_battery).state;
          bool low = !std::isnan(pct) && pct <= 25.0f;
          bool limited = id(d1001_charge_limit).state && id(d1001_charge_cut);
          bool screen_blocks = id(d1001_charge_screen_off).state && id(d1001_screen_on);
          if (low || (!limited && !screen_blocks))
            id(d1001_bat_charge_en).turn_off();  // active-low: low = charge enabled
          else
            id(d1001_bat_charge_en).turn_on();

binary_sensor:
  - platform: gpio
    name: "En charge"
    id: d1001_charging
    device_class: battery_charging
    pin:
      number: GPIO15
      inverted: true   # charge-state line is active-low (low = charging)
    # The charger's status line bursts at ~10 Hz around charge start/stop (seen on a laptop USB
    # port). Only report a state that held for 2 s: no flickering label, no burst of HA
    # updates, no false reading in the low-battery cutoff.
    filters:
      - delayed_on_off: 2s

light:
  - platform: monochromatic
    id: d1001_backlight
    output: d1001_bl_pwm
    restore_mode: ALWAYS_ON
    internal: true
    on_turn_on:
      - globals.set:
          id: d1001_screen_on
          value: "true"
      - script.execute: d1001_charge_apply
    on_turn_off:
      - globals.set:
          id: d1001_screen_on
          value: "false"
      - script.execute: d1001_charge_apply

display:
  - platform: mipi_dsi
    id: d1001_display
    model: SEEED-RETERMINAL-D1001
    update_interval: never
    enable_pin:
      - xl9535: d1001_expander
        number: 0          # LCD_PWR_EN (EXP_GPO0)
      - xl9535: d1001_expander
        number: 7          # alim/backlight (EXP_GPO7)
    reset_pin:
      xl9535: d1001_expander
      number: 2            # LCD_RST (EXP_GPO2)

# Tactile GSL3670 via le composant officiel (clydebarrow, modèle seeed-reterminal-d1001 :
# firmware binaire dédié + reset/init corrects). Cf. external_components ci-dessous.
touchscreen:
  - platform: gsl3670
    id: d1001_touch
    model: seeed-reterminal-d1001
    i2c_id: i2c_panel
    # Use the official model defaults (interrupt 16, calibration, transform, firmware).
    # Only the reset needs our XL9535 hub id; the correct reset line is pin 14 (not 12).
    reset_pin:
      xl9535: d1001_expander
      number: 14

external_components:
  # gsl3670 needs the touchscreen base changes from the same PR (option_with_default).
  - source: github://clydebarrow/esphome@gsl3670
    components: [gsl3670, touchscreen]

lvgl:
  # The whole UI is built in C++ by ha_dashboard; an explicit empty list stops lvgl from
  # compiling its default "hello world" page. That page used to enable, by accident, the
  # widgets the renderer needs -- they are now enabled explicitly in esphome.build_flags.
  widgets: []
  displays:
    - d1001_display
  touchscreens:
    - d1001_touch

# === Audio (voice assistant) ===
# The D1001 wires the speaker (ES8311) and the dual mic (ES7210) to TWO SEPARATE I2S
# peripherals (I2S0 + I2S1), so the ESP32-P4 shared-bus full-duplex limitation
# (esphome#16043) does NOT apply here. Pins from the Seeed reTerminal-D1001 BSP
# (driver_examples/02_I2SCodec_es7210/main/example_config.h). Codecs on the system I2C bus.
i2s_audio:
  - id: i2s_spk            # ES8311 speaker path (I2S #0)
    i2s_mclk_pin: GPIO33
    i2s_bclk_pin: GPIO32
    i2s_lrclk_pin: GPIO31
  - id: i2s_mic            # ES7210 microphone path (I2S #1, independent bus)
    i2s_mclk_pin: GPIO29
    i2s_bclk_pin: GPIO28
    i2s_lrclk_pin: GPIO27

audio_dac:
  - platform: es8311
    id: d1001_es8311
    i2c_id: i2c_sys
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit

audio_adc:
  - platform: es7210
    id: d1001_es7210
    i2c_id: i2c_sys
    address: 0x40
    sample_rate: 16000
    bits_per_sample: 16bit
    mic_gain: 30db

speaker:
  - platform: i2s_audio
    id: d1001_speaker
    i2s_audio_id: i2s_spk
    dac_type: external
    i2s_dout_pin: GPIO30
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit
    # Keep the I2S bus running instead of stopping ~500 ms after audio ends. Restarting the
    # bus produces an audible "pop"/click transient (heard before the first sound after a few
    # seconds idle, e.g. before a tap click or the wake-word ding). The whole chain is 16 kHz
    # (via the resampler) so the bus never needs to reconfigure either.
    timeout: never

microphone:
  - platform: i2s_audio
    id: d1001_microphone
    i2s_audio_id: i2s_mic
    adc_type: external
    i2s_din_pin: GPIO26
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit
